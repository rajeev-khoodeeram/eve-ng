---
- name: Test IOL switches through Telnet
  hosts: switches
  gather_facts: false
  connection: local

  tasks:
    - name: Run show version
      ansible.netcommon.telnet:
        host: "{{ ansible_host }}"
        user: "{{ ansible_user }}"
        password: "{{ ansible_password }}"
        login_prompt: "Username:"
        password_prompt: "Password:"
        prompts:
          - "[>#]"
        command:
          - terminal length 0
          - show version
      register: output

    - name: Display output
      ansible.builtin.debug:
        var: output.output
